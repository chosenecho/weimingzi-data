[project]
name = "weimingzi-ingest-probe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "bilibili-api-zoku==17.4.4",
  "qrcode-terminal==0.8",
  "pycryptodome==3.23.0; sys_platform == 'emscripten'",
]

[tool.uv]
# Pyodide provides Crypto, whereas zoku imports the identical Cryptodome API.
override-dependencies = ["pycryptodomex; sys_platform != 'emscripten'"]

[tool.uv.sources]
qrcode-terminal = { path = "vendor-wheels/qrcode_terminal-0.8-py3-none-any.whl" }
