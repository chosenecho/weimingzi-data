name: Corpus checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            src
            tools
            tests
            docs/contracts
            docs/examples
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -X utf8 -m unittest discover -s tests -v
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -X utf8 tools/check_repository.py
      - run: uv run python -X utf8 -m unittest discover -s tests -p test_coverage.py -v
      - run: uv run python -X utf8 -m unittest discover -s tests -p test_topics.py -v
      - run: uv run python -X utf8 -m unittest discover -s tests -p test_local_revision.py -v
      - run: uv run python -X utf8 tools/preservation_manifest.py check-current --read-only
      - run: uv run python -X utf8 tools/preservation_manifest.py verify-log
