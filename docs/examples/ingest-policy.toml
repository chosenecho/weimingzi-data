# Informational deployment example. Runtime permissions live in ingest/policy.py.
# This file grants no permissions and no workflow reads it automatically.
policy_version = 2
contract_version = 2
record_schema_version = 3
enabled = false
repository = "chosenecho/weimingzi-data"
branch = "main"
platform = "bilibili"
target_uid = "23191782"
allowed_producers = ["weimingzi-bilibili-ingest"]
allowed_media_bucket_aliases = ["archive"]

[limits]
manifest_bytes = 2097152
payload_file_bytes = 16777216
payload_total_bytes = 67108864
operations = 2000
files = 2000

[insert_kinds]
items = ["video", "video_part", "post", "article", "video_collection"]
documents = ["transcript", "edited_transcript", "post", "article"]
assets = ["audio", "archive"]
annotations = []

[append_fields]
items = ["urls", "relations", "members"]
documents = []
assets = ["downloads"]

[transport]
# Resolve storage aliases in deployment; packages never supply hosts or secrets.
storage = "oss"
bucket_alias = "handoff"
object_prefix = "handoffs/weimingzi-data/native-v2/"
