<p>累世虫沙嗜孟婆，去云来雨摽梅肥。<br></p><p>贸然江表逢人说，俄尔洛阳命驾归。</p><p>谈笑林中阮巷南，号悲宇内卞山非。</p><p>天涯水际愁浓月，叶绿三眠梦更稀。</p><p><br></p><p>翻译：</p><p>抱朴子说：“士兵中的平民死后会变成虫沙”，有一位孟婆汤喝上瘾，几辈子都是虫沙的人。</p><p>云雨来去，吹落成熟的梅子。</p><p>有人贸贸然在江南逢人就说项夸他的好。</p><p>于是他不久就从都市回到故乡。</p><p>像竹林里的阮家父子，住在贫穷的巷子南边谈笑度日；</p><p>为那些因善良而罹难，仅仅因怀璧而受其罪的人悲号。</p><p>天涯水际，月光浓得惹人发愁，李白说：“吴地桑<span class="highlighted">叶绿</span>，<span class="link">吴蚕</span>已<span class="link">三眠</span>。”<br></p><p>春风吹来，桑叶已绿，蚕虫醒了又睡，一再而三，梦却倍加依稀。</p>
