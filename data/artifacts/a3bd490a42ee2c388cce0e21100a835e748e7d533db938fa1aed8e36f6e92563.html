<p>吾心将止，不知所之。</p><p> 时轮运转，生息流变。</p><p> 万物发于无迹，百类奋其自居。</p><p> 星流遣不明之耀，风语追岂吟之诗。</p><p> 人间喑默，心野喧哗。</p><p> 云图如止，意泉似沸。 </p><p>逐利者损内而兴外，得凌霄之冽而晓众。</p><p> 好名者夺古而御今，起沉渊之奥而暗己。</p><p> 无命之思，筑舍于命定之魂。</p><p> 不净之视，解帘于净尽之听。 </p><p>三生寻觅，音颡凭墟而忽静。 </p><p>六花消隐，䀒瞑抚相而稍惊。</p><p> 平呈世事，歧引密由。 </p><p>吞江吐露，餐月唾晶。 </p><p>将聆地籁，纵奇类以冕身主。 </p><p>遂祝天告，裸南国而放心王。 </p><p>启于飞弋，终于伏罗。 </p><p>如月见草，似风信花。</p><p><br/></p><p><br/></p><p>按：五年前作。月见风信，而人已渺茫矣。</p>
