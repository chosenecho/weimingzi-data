<p><span style="background:;color:;">前世须知：今生亦短，须臾落魄中阴。</span></p><p><span style="background:;color:;">死后皆空，千古寂寞幽寻。</span></p><p><span style="background:;color:;">纵使此心无事，业力犹自驱人。</span></p><p><span style="background:;color:;">造化谁代换？趁我无思，逢月邀宾。</span></p><p><span style="background:;color:;">
</span></p><p><span style="background:;color:;">笑君疏忽清梦，昨宵真或假，也共流尘。</span></p><p><span style="background:;color:;">漂荡风烟溪谷，玉羽晶鳞。</span></p><p><span style="background:;color:;">枭勇雄豪怎觅，效死地、头颈轻伸。</span></p><p><span style="background:;color:;">总不嗔天下蠢，归处谁迎？濯秽灵均。</span></p><p><span style="background:;color:;">2017年1月22日</span></p><p><span style="background:;color:;">
