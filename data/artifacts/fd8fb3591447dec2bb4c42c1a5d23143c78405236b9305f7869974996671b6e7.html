<p><span style="background:;color:;">积岸新石，浮汀旧草，冬来水落船低。</span><span style="background:;color:;">
</span><span style="background:;color:;">移目游江，翻如仄海平溪。</span><span style="background:;color:;">
</span><span style="background:;color:;">都从此地攻吴去，纵轻寒、不必思衣。</span><span style="background:;color:;">
</span><span style="background:;color:;">续空机、玉艞金舳，余照当西。</span></p><p><span style="background:;color:;">
</span><span style="background:;color:;">从来小觑霜和雾，算波澜无力，也与风齐。</span><span style="background:;color:;">
</span><span style="background:;color:;">御寇泠然，凌空慕我舟栖。</span><span style="background:;color:;">
</span><span style="background:;color:;">浮槎枕梦沉星月，怪银河、左右无堤。</span><span style="background:;color:;">
</span><span style="background:;color:;">正幽时、睡淡愁云，懒启玄黎。</span></p><p><span style="background:;color:;">
</span></p><p><span style="background:;color:;">按：十一年前过三峡，五年前有此作。</span></p><p><span style="background:;color:;">后人应知，吾居世时，非唯道术为天下裂，天下亦为古今裂，古今亦为神明裂。神明者，人心也。人心者，时、命之所听也，而无数。</span></p><p><span style="background:;color:;">李适改税，舍杨炎而用卢杞，至二四之乱，赖泌晟而止。</span></p><p><span style="background:;color:;">翰林白纸，何不早裂？</span></p><p><span style="background:;color:;">洛纸虽贵，若罢之有用，奉汝将相何？</span></p>
