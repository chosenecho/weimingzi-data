<p><span style="background:;color:var(--Ga9, #2F3238);">一个人想要去阿拉斯加</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">就得戴着铁头盔</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">在一条封闭的跑道上</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">提防着头顶掉下来连着绳索的铁锤</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">一路叮叮当当</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">就这么跑到印度， 跑到四川， 跑到白令海峡， 跑到阿拉斯加</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">我可能记错了路径</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">但就是这个荒唐的场景</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">在我快要入睡的片刻</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">激起我会心的一笑</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">雨停了，该继续昏睡了?</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">不，我会清醒着做古怪的梦</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">不时笑醒</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">如果…</span></p><p><span style="background:;color:var(--Ga9, #2F3238);">写于2020年2月12日2点42分</span></p><p><span style="background:;color:;">
</span></p>
