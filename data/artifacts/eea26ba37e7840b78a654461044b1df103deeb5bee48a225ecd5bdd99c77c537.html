<p><span style="background:;color:;">少时入蜀历三峡，卧眺崟崎剖左符。</span></p><p><span style="background:;color:;">蜀汉江陵万树橘，秋君肃杀用三驱。</span></p><p><span style="background:;color:;">青天无到觉霜鬓，巴水有停思绿珠。</span></p><p><span style="background:;color:;">细犊孟津驱逐久，洛阳风景尽归吴。</span></p><p><span style="background:;color:;">三千三百三朝暮，绿珠知彼不知吾。</span></p><p><span style="background:;color:;">我今随浪奔夷陵，一篑功亏万骨枯。</span></p><p><span style="background:;color:;">湘水如何归秭归，巫云岂复赴登徒。</span></p><p><span style="background:;color:;">永安薄德追三代，成帝空仓待五铢。</span></p><p><span style="background:;color:;">心比赤孩难出谷，情如老骥勉为驹。</span></p><p><span style="background:;color:;">兴亡结绪繁堪理，生死飘蓬直不扶。</span></p><p><span style="background:;color:;">咀嚼蓬麻因暂忘，依凭大块为长躯。</span></p><p><span style="background:;color:;">盈盈脉脉虽无语，皎皎迢迢永不渝。</span></p><p><span style="background:;color:;">
</span></p>
