<p><span style="background:;color:;">松陵何幸事，绝代有佳人。</span></p><p><span style="background:;color:;">方喜同軿轩，舜华难具陈。</span></p><p><span style="background:;color:;">
</span></p><p><span style="background:;color:;">初见如明月，泠泠照玉尘。</span></p><p><span style="background:;color:;">存思带浅笑，不语有轻颦。</span></p><p><span style="background:;color:;">云泽涵幽梦，清眸化太真。</span></p><p><span style="background:;color:;">去鸾凌素波，洄渚坐氲氤。</span></p><p><span style="background:;color:;">北适非栖心，南归不触尘。</span></p><p><span style="background:;color:;">遭逢未半冬，际遇胜三春。</span></p><p><span style="background:;color:;">
</span></p><p><span style="background:;color:;">再见如秋水，绵绵映汉津。</span></p><p><span style="background:;color:;">相逢识面少，独饮叩壶频。</span></p><p><span style="background:;color:;">粲粲论藏舟，悠悠观放鳞。</span></p><p><span style="background:;color:;">随颜变绮态，聆静倚轻身。</span></p><p><span style="background:;color:;">月杵含灵氛，星机绽绛唇。</span></p><p><span style="background:;color:;">我思成意绪，竟夜期新晨。</span></p><p><span style="background:;color:;">
</span></p><p><span style="background:;color:;">不见如沧海，冥冥瞭北辰。</span></p><p><span style="background:;color:;">穹窿盖万端，天井挂无垠。</span></p><p><span style="background:;color:;">鹏羽故难支，扶摇岂足振。</span></p><p><span style="background:;color:;">孤程有返岁，何意比萧陈。</span></p><p><span style="background:;color:;">风起寻梅子，雨来失醉巾。</span></p><p><span style="background:;color:;">为谁慷且慨，别后倍伤神。</span></p>
