<p>看月明一色绝纤尘，小雨夜初阑</p><p>劝长星共饮，玉壶击碎，斟满云川</p><p>任尔峰回路转，气候在吴关</p><p>莫道春风暖，静处霜繁</p><p><br></p><p>值此汹汹海内，宁称孤道寡，寂寞曹瞒</p><p>纵千秋万载，高处不胜寒</p><p>按琼箫、倚歌呜咽，掩芳林、风堕暗香残</p><p>都归去、守穷嗟叹，尽上元欢</p><p><br></p><p>按：司马迁云：“谈言微中，亦可以解纷。”老耽云：“多闻数穷，不若守于中。”此皆鄙陋老儒之言也，不足为凭。</p><p>夫起于微末者，非刀兵之世，唯言可以。未发者中，天下之本。天何言哉？下知有之。</p><p>而言亦有刀兵之用，刀兵亦有诛心释怀、为祟解纷之别。缚鸡冗辈岂知之？</p>
