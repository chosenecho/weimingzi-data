[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weimingzi-corpus"
version = "0.1.0"
description = "Offline corpus handoff, editable snapshots and purpose-specific projections"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wm-corpus = "weimingzi_corpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
